<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDtoBeauty — Converti Markdown</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="logo">
    <!-- MD icon -->
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="36" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
      <rect x="1" y="1" width="34" height="34" rx="7" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <text x="5" y="25" font-family="monospace" font-size="15" font-weight="900" fill="white"># →</text>
    </svg>
    MDtoBeauty
  </div>
  <p>Converti file Markdown in documenti Word o PDF pronti per la stampa</p>
</header>

<main>

  <!-- ── Upload Card ── -->
  <section class="card">
    <h2>Documenti Markdown</h2>

    <!-- Drop Zone -->
    <div class="dropzone" id="dropzone" role="region" aria-label="Area di caricamento file">
      <div class="dropzone-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="16 16 12 12 8 16"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
      </div>
      <p>Trascina i file <strong>.md</strong> qui</p>
      <p class="hint">Supporta file multipli — verranno uniti nell'ordine indicato</p>
      <button class="btn-outline" id="pick-files" type="button">Sfoglia file</button>
      <input type="file" id="file-input" multiple accept=".md,.markdown,.txt" hidden>
    </div>

    <!-- Files List -->
    <div id="files-list"></div>

    <!-- Text Toggle -->
    <button class="text-toggle" id="text-toggle" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Aggiungi testo markdown direttamente
    </button>

    <!-- Inline Text Input -->
    <div class="text-section" id="text-section" style="display:none">
      <label for="text-input">Testo Markdown</label>
      <textarea
        id="text-input"
        placeholder="# Titolo&#10;&#10;Scrivi o incolla qui il tuo contenuto markdown...&#10;&#10;## Sezione&#10;Testo normale, **grassetto**, _corsivo_."
        spellcheck="false"
        aria-label="Testo markdown da convertire"
      ></textarea>
    </div>
  </section>

  <!-- ── Settings Card ── -->
  <section class="card">
    <h2>Impostazioni di conversione</h2>
    <div class="settings-row">

      <div class="setting-group">
        <label>Formato output</label>
        <div class="toggle-group" role="group" aria-label="Formato output">
          <button class="toggle-btn active" data-format="docx" type="button">
            Word (.docx)
          </button>
          <button class="toggle-btn" data-format="pdf" type="button">
            PDF
          </button>
        </div>
      </div>

      <div class="setting-group">
        <label>Separatore tra file</label>
        <div class="toggle-group" role="group" aria-label="Separatore tra file">
          <button class="toggle-btn active" data-sep="pagebreak" type="button" title="Ogni file inizia su una nuova pagina">
            Nuova pagina
          </button>
          <button class="toggle-btn" data-sep="hr" type="button" title="Separatore visivo con linea orizzontale">
            Linea (—)
          </button>
          <button class="toggle-btn" data-sep="none" type="button" title="Nessun separatore, contenuto continuo">
            Nessuno
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- ── Convert Button ── -->
  <button class="btn-convert" id="convert-btn" type="button">
    <span id="convert-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Converti e Scarica
    </span>
  </button>

</main>

<!-- ── Toast Notification ── -->
<div class="toast" id="toast" role="alert" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <span class="toast-msg"></span>
</div>

<script src="/static/app.js"></script>
</body>
</html>
